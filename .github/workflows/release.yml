# 打上版本標籤就自動發布一版，讓任何人都能下載
#
# 跟 windows.yml 的差別只有一個，但很關鍵：
#   windows.yml 產生的是 artifact —— 要登入 GitHub 才下載得到，30 天過期。
#   這支產生的是 Release —— 公開網址、不用登入、永久保存。
#   要放到網頁上給外人下載的，只能是 Release。
#
# 怎麼發一版：
#   git tag v1.0 && git push origin v1.0
#
# 跑完之後固定網址（給下載頁面用，永遠指向最新版）：
#   https://github.com/<你>/<repo>/releases/latest
#   https://github.com/<你>/<repo>/releases/latest/download/PN-Anywhere-Windows.zip
#
# 注意：private repo 的 Release 也是 private 的。要讓陌生人下載，repo 得公開。

name: 發布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # 也可以手動按，用當下的 commit 發一版測試

permissions:
  contents: write           # gh release create 要寫入的權限

env:
  APP: PN Anywhere
  ZIP: PN-Anywhere-Windows.zip    # 檔名不放空白，網址才不會變成 %20

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      # 發布前一定要再跑一次測試。這是唯一一道「別把壞的東西送出去」的關卡。
      - name: 跑測試
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tests/test_win.py
          python tests/test_live.py
          python tests/test_formats.py
          python tests/test_dupes.py

      - name: 打包
        run: pyinstaller --noconfirm --clean packaging/windows.spec

      - name: 附上資料與說明，壓成一包
        shell: pwsh
        run: |
          $out = "dist/$env:APP"
          New-Item -ItemType Directory -Force -Path "$out/data" | Out-Null
          Copy-Item -Recurse -Force "data/*" "$out/data/" -ErrorAction SilentlyContinue
          Copy-Item -Force "README.md" "$out/README.md"
          Copy-Item -Force "docs/怎麼用.txt" "$out/怎麼用.txt"
          if (-not (Test-Path "$out/$env:APP.exe")) { throw "沒有產生 exe" }
          Compress-Archive -Path "$out/*" -DestinationPath $env:ZIP -Force
          "{0:N1} MB" -f ((Get-Item $env:ZIP).Length / 1MB) | Write-Host

      # 用內建的 gh，不引第三方 action —— 發布流程上的東西越少越好
      - name: 建立 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
            "dev-" + $env:GITHUB_SHA.Substring(0,7)
          }
          $notes = @"
          ## 下載

          **[$env:ZIP](https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$env:ZIP)**

          解壓到一個**新資料夾**，雙擊 ``$env:APP.exe``。不需要安裝 Python。

          第一次開會跳「Windows 已保護您的電腦」——那是因為沒有付費的數位簽章。
          點「其他資訊」→「仍要執行」。

          ## 怎麼用

          1. 按 ``Shift + Alt + Space`` 叫出查詢視窗
          2. 打字就直接找，不用按 Enter
          3. ``↑↓`` 選、``Enter`` 看完整資料、``esc`` 關掉

          第一次要先從工作列圖示 →「匯入 Price Book」把你的 Excel 放進來。

          ## 出問題

          改開 ``$env:APP-診斷版.exe``，它會把每一步印在黑色視窗上。
          或右鍵工作列圖示 →「診斷資訊…」→「複製全部」。
          "@
          gh release create $tag $env:ZIP `
            --title "$env:APP $tag" `
            --notes $notes `
            --latest
