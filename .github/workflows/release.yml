# 打上版本標籤就自動發布一版，讓任何人都能下載
#
# 跟 windows.yml 的差別只有一個，但很關鍵：
#   windows.yml 產生的是 artifact —— 要登入 GitHub 才下載得到，30 天過期。
#   這支產生的是 Release —— 公開網址、不用登入、永久保存。
#   要放到網頁上給外人下載的，只能是 Release。
#
# 怎麼發一版：
#   git tag v1.0 && git push origin v1.0
#
# 跑完之後的固定網址（給下載頁面用，永遠指向最新版）：
#   https://github.com/<你>/<repo>/releases/latest/download/PN-Anywhere-Windows.zip
#   https://github.com/<你>/<repo>/releases/latest/download/PN-Anywhere-macOS.zip
#
# 注意：private repo 的 Release 也是 private 的。要讓陌生人下載，repo 得公開。

name: 發布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # 也可以手動按，用當下的 commit 發一版測試

permissions:
  contents: write           # gh release create 要寫入的權限

env:
  APP: PN Anywhere
  # 檔名不放空白，網址才不會變成 %20
  ZIP_WIN: PN-Anywhere-Windows.zip
  ZIP_MAC: PN-Anywhere-macOS-AppleSilicon.zip
  ZIP_MAC_INTEL: PN-Anywhere-macOS-Intel.zip

jobs:
  # 兩個平台各自打包，最後由 release job 收攏成同一個 Release。
  # 分開跑的好處：一邊掛了另一邊還是有東西可看，不用整輪重來。

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      # 發布前一定要再跑一次測試。這是唯一一道「別把壞的東西送出去」的關卡。
      - name: 跑測試
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tests/test_win.py
          python tests/test_live.py
          python tests/test_formats.py
          python tests/test_dupes.py
          python tests/test_hotkey_set.py
          python tests/test_hotkey_probe.py

      - name: 打包
        run: pyinstaller --noconfirm --clean packaging/windows.spec

      - name: 附上資料與說明，壓成一包
        shell: pwsh
        run: |
          $out = "dist/$env:APP"
          New-Item -ItemType Directory -Force -Path "$out/data" | Out-Null
          Copy-Item -Recurse -Force "data/*" "$out/data/" -ErrorAction SilentlyContinue
          Copy-Item -Force "README.md" "$out/README.md"
          Copy-Item -Force "docs/怎麼用.txt" "$out/怎麼用.txt"
          if (-not (Test-Path "$out/$env:APP.exe")) { throw "沒有產生 exe" }
          # 壓資料夾本身，不要壓 "$out/*" —— 後者解開會把幾百個檔案
          # 直接倒進使用者的下載資料夾，找不到 exe 在哪
          Compress-Archive -Path $out -DestinationPath $env:ZIP_WIN -Force
          "Windows：{0:N1} MB" -f ((Get-Item $env:ZIP_WIN).Length / 1MB) | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: pack-windows
          path: ${{ env.ZIP_WIN }}
          retention-days: 1        # 只是給下一個 job 接手，不用留

  macos:
    # macos-latest 是 Apple 晶片，打出來的執行檔是 arm64 專用的 ——
    # Intel Mac 拿到會完全無法啟動：沒有錯誤訊息、沒有圖示、什麼都沒有。
    # 使用者只會覺得「這東西是壞的」。所以兩種架構都要出。
    # Intel 版暫時停掉：GitHub 唯一的 Intel Mac runner（macos-13）已經在
    # 退役，實測排隊 24 分鐘連跑都沒開始，會把整個發布卡死（預設 6 小時
    # 才逾時）。要恢復的話把下面那組取消註解，前提是那個 label 還排得到：
    #   - runner: macos-13
    #     arch: Intel
    # 真正的長久解法是出 universal2（一個檔案同時支援兩種 CPU），
    # 但那需要 universal2 的 Python 和所有套件的 universal2 wheel。
    strategy:
      fail-fast: false        # 一邊掛了另一邊還是要有東西可下載
      matrix:
        include:
          - runner: macos-latest    # Apple 晶片（M1 之後）
            arch: AppleSilicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: 跑測試
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_win.py
          python tests/test_live.py
          python tests/test_formats.py
          python tests/test_dupes.py
          python tests/test_hotkey_set.py
          python tests/test_hotkey_probe.py

      - name: 打包成 .app
        run: pyinstaller --noconfirm --clean packaging/macos.spec

      # v1.0 出過的包漏了這個：偵測輔助使用權限的模組沒進去，
      # 程式就以為自己不需要權限，跳過整個授權引導，改跳一個
      # 叫使用者去改 settings.json 的訊息 —— 完全幫不上忙。
      # 它是 pynput 的相依套件（不是 Quartz 的），CI 上沒人帶它進來。
      # 這一步就是不讓同樣的東西再送出去一次。
      - name: 檢查權限模組有沒有進到 .app 裡
        run: |
          F="dist/$APP.app/Contents/Frameworks"
          for m in HIServices Quartz objc; do
            test -d "$F/$m" || { echo "❌ .app 裡漏了 $m"; exit 1; }
          done
          echo "✓ 權限與熱鍵需要的原生模組都在"

      - name: 壓成一包
        run: |
          test -d "dist/$APP.app" || { echo "沒有產生 .app"; exit 1; }
          ZIP="PN-Anywhere-macOS-${{ matrix.arch }}.zip"
          # 確認打出來的真的是這台機器的架構，不要出現 Intel 那包裡
          # 裝的其實是 arm64 執行檔這種事
          lipo -archs "dist/$APP.app/Contents/MacOS/$APP"
          # 一定要用 ditto 不要用 zip：.app 裡面有 symlink 和延伸屬性，
          # 一般的 zip 壓完解開會壞掉，使用者只會看到「應用程式已損毀」。
          ditto -c -k --sequesterRsrc --keepParent "dist/$APP.app" "$ZIP"
          echo "macOS ${{ matrix.arch }}：$(du -h "$ZIP" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: pack-macos-${{ matrix.arch }}
          path: PN-Anywhere-macOS-${{ matrix.arch }}.zip
          retention-days: 1

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          merge-multiple: true

      - name: 建立 Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="dev-${GITHUB_SHA:0:7}"
          fi
          ls -lh *.zip

          cat > notes.md <<EOF
          ## 下載

          | | |
          |---|---|
          | **Windows** | [$ZIP_WIN](https://github.com/$REPO/releases/download/$TAG/$ZIP_WIN) |
          | **macOS**（Apple 晶片 M1～M4） | [$ZIP_MAC](https://github.com/$REPO/releases/download/$TAG/$ZIP_MAC) |

          > **Intel Mac 目前不支援。** 這一版只能在 Apple 晶片上跑，
          > Intel 機器下載後會完全沒有反應（不是壞掉，是 CPU 架構不同）。
          > 不確定的話：左上角  →「關於這台 Mac」→ 看「晶片」那一行。

          不需要安裝 Python，解壓就能用。

          ### Windows
          解壓到一個**新資料夾**，雙擊 \`$APP.exe\`。
          第一次會跳「Windows 已保護您的電腦」—— 那是因為沒有付費的數位簽章。
          點「其他資訊」→「仍要執行」。

          ### macOS
          解壓後把 \`$APP.app\` 拖進「應用程式」再打開。

          第一次會跳「Apple 無法驗證⋯」。**macOS Sequoia 之後右鍵「打開」已經沒用了**，
          要這樣做：
          1. 按「**完成**」（不要按丟到垃圾桶）
          2. 系統設定 →「**隱私權與安全性**」
          3. 捲到最下面的「安全性」區塊 → 按「**仍要打開**」
          4. 再確認一次

          全域熱鍵需要「輔助使用」權限，程式第一次啟動會自己跳出來引導。

          ## 怎麼用

          1. 按 \`Shift + Alt + Space\`（mac 是 \`⌥⇧Space\`）叫出查詢視窗
          2. 打字就直接找，不用按 Enter
          3. \`↑↓\` 選、\`Enter\` 看完整資料、\`← →\` 看同一料號的其他列、\`esc\` 關掉

          第一次要先從工作列／選單列圖示 →「匯入 Price Book」把你的 Excel 放進來。
          資料只留在你自己的電腦，不會上傳到任何地方。

          ## 出問題

          Windows 改開 \`$APP-診斷版.exe\`，它會把每一步印在黑色視窗上。
          兩個平台都可以：右鍵圖示 →「診斷資訊…」→「複製全部」。
          EOF

          gh release create "$TAG" *.zip \
            --repo "$REPO" \
            --title "$APP $TAG" \
            --notes-file notes.md \
            --latest
